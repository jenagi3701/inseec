<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4dc">
  <meta name="description" content="EGG ME — a cozy pixel-art egg timer.">
  <title>EGG ME</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 10' shape-rendering='crispEdges'%3E%3Cpath fill='%233d2817' d='M2 0h4v1h1v2h1v5H7v1H6v1H2V9H1V8H0V3h1V1h1z'/%3E%3Cpath fill='%23fffaf0' d='M2 1h4v2h1v5H6v1H2V8H1V3h1z'/%3E%3Cpath fill='%23ffa41b' d='M3 4h2v1h1v2H5v1H3V7H2V5h1z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skipToContent">Skip to content</a>

  <header class="topbar">
    <div class="lang-switch" role="group" data-i18n-aria-label="languageLabel" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en" aria-pressed="true" lang="en" aria-label="English">EN</button>
      <span class="lang-sep" aria-hidden="true">|</span>
      <button type="button" class="lang-btn" data-lang="fr" aria-pressed="false" lang="fr" aria-label="Français">FR</button>
    </div>
  </header>

  <main id="main">
    <!-- ============ HOME ============ -->
    <section class="screen screen-home" id="screen-home" aria-labelledby="home-title">
      <h1 class="logo" id="home-title" tabindex="-1">
        <span class="logo-text" data-i18n="appName">EGG ME</span>
      </h1>

      <fieldset class="egg-picker" id="egg-picker">
        <legend class="visually-hidden" data-i18n="pickLegend">Choose your egg</legend>
        <div class="egg-grid" id="egg-grid">
          <!-- Egg cards are generated by script.js -->
        </div>
      </fieldset>

      <div class="cta-wrap">
        <button type="button" class="btn btn-primary btn-start" id="start-btn" aria-disabled="true" aria-describedby="start-hint">
          <span class="btn-label" data-i18n="startCooking">START COOKING</span>
          <span class="btn-time" id="start-time" aria-hidden="true"></span>
        </button>
        <p class="hint" id="start-hint" aria-live="polite"></p>
      </div>

      <details class="tip">
        <summary>
          <span class="tip-icon" aria-hidden="true"></span>
          <span data-i18n="eggTip">EGG TIP</span>
        </summary>
        <p data-i18n="eggTipText">Cooking times are approximate and may vary depending on the egg and cooking conditions.</p>
      </details>
    </section>

    <!-- ============ TIMER ============ -->
    <section class="screen screen-timer" id="screen-timer" aria-labelledby="timer-title" hidden>
      <h1 class="logo logo-small" id="timer-title" tabindex="-1">
        <span class="logo-text" data-i18n="appName">EGG ME</span>
      </h1>

      <div class="pot-scene" id="pot-scene" aria-hidden="true">
        <div class="steam">
          <span class="puff p1"></span><span class="puff p2"></span><span class="puff p3"></span><span class="puff p4"></span>
        </div>
        <div class="pot-egg" id="pot-egg"></div>
        <div class="pot" id="pot"></div>
        <div class="bubbles">
          <span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span><span class="bubble b4"></span>
        </div>
        <div class="flames" id="flames"></div>
      </div>

      <div class="countdown" id="countdown">
        <div class="countdown-digits" id="countdown-digits" aria-hidden="true"></div>
        <p class="visually-hidden" role="timer" id="countdown-text">06:00</p>
      </div>

      <p class="status" id="timer-status" data-i18n="cooking">YOUR EGG IS COOKING…</p>

      <div class="timer-meta">
        <span class="meta-level" id="timer-level">MEDIUM SOFT</span>
        <span class="meta-dot" aria-hidden="true">•</span>
        <span class="meta-time" id="timer-total">6:00</span>
      </div>

      <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria-label="progressLabel" aria-label="Cooking progress">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="controls">
        <button type="button" class="btn btn-control btn-pause" id="pause-btn">
          <span class="btn-icon icon-pause" aria-hidden="true"></span>
          <span class="btn-label" id="pause-label" data-i18n="pause">PAUSE</span>
        </button>
        <button type="button" class="btn btn-control btn-restart" id="restart-btn">
          <span class="btn-icon icon-restart" aria-hidden="true"></span>
          <span class="btn-label" data-i18n="restart">RESTART</span>
        </button>
        <button type="button" class="btn btn-control btn-cancel" id="cancel-btn">
          <span class="btn-icon icon-cancel" aria-hidden="true"></span>
          <span class="btn-label" data-i18n="cancel">CANCEL</span>
        </button>
      </div>
    </section>

    <!-- ============ DONE ============ -->
    <section class="screen screen-done" id="screen-done" aria-labelledby="done-title" hidden>
      <p class="logo logo-small" aria-hidden="true">
        <span class="logo-text" data-i18n="appName">EGG ME</span>
      </p>

      <div class="done-scene" aria-hidden="true">
        <div class="sparkles">
          <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
          <span class="spark s4"></span><span class="spark s5"></span><span class="spark s6"></span>
        </div>
        <div class="steam steam-done">
          <span class="puff p1"></span><span class="puff p2"></span><span class="puff p3"></span>
        </div>
        <div class="done-egg" id="done-egg"></div>
        <div class="plate"></div>
      </div>

      <h1 class="done-title" id="done-title" tabindex="-1" data-i18n="ready">YOUR EGG IS READY!</h1>
      <p class="done-level" id="done-level">MEDIUM SOFT</p>
      <p class="done-tip" data-i18n="doneTip">Plunge it into cold water to stop the cooking.</p>

      <div class="done-actions">
        <button type="button" class="btn btn-secondary" id="sound-btn" hidden>
          <span class="btn-icon icon-bell" aria-hidden="true"></span>
          <span class="btn-label" data-i18n="playSound">PLAY ALARM</span>
        </button>
        <button type="button" class="btn btn-primary" id="again-btn">
          <span class="btn-label" data-i18n="cookAnother">COOK ANOTHER EGG</span>
        </button>
      </div>
    </section>
  </main>

  <div class="flash" id="flash" aria-hidden="true"></div>

  <!-- Screen-reader announcements -->
  <div class="visually-hidden" id="announcer" aria-live="polite" aria-atomic="true"></div>
  <div class="visually-hidden" id="alert-announcer" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <script src="script.js"></script>
</body>
</html>
